<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Диагностика BAYRIM</title>

<style>
/* Layout: one narrow column, phone first; sticky header, step bar fixed at the bottom. Palette = ALTO report theme (navy / blue / grey, red only for errors). */
:root{
 --bg:#F5F7FA; --surface:#FFFFFF; --text:#172B4D; --muted:#596579; --border:#DFE5EE; --border-strong:#C5CFDC;
 --accent:#2563EB; --accent-bg:#EAF1FF; --accent-text:#1D4ED8; --navy:#0F2A5C; --on-navy:#FFFFFF;
 --red:#DC2626; --red-bg:#FDECEC; --brand-red:#C0392B; --shadow:0 2px 10px rgba(23,43,77,.08);
 --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0B1220; --surface:#121D30; --text:#F1F5F9; --muted:#9AA8BD; --border:#243450; --border-strong:#34476A;
 --accent:#60A5FA; --accent-bg:#1A3155; --accent-text:#93C5FD; --navy:#C7D7F5; --on-navy:#0B1220;
 --red:#F87171; --red-bg:#3D1717; --brand-red:#F87171; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0B1220; --surface:#121D30; --text:#F1F5F9; --muted:#9AA8BD; --border:#243450; --border-strong:#34476A;
 --accent:#60A5FA; --accent-bg:#1A3155; --accent-text:#93C5FD; --navy:#C7D7F5; --on-navy:#0B1220;
 --red:#F87171; --red-bg:#3D1717; --brand-red:#F87171; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--border)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.top h1{flex:1;min-width:0;margin:0;font-size:17px;font-weight:700;letter-spacing:-.2px}
.top h1 span{color:var(--muted);font-weight:500}
.lg{display:flex;border:1px solid var(--border-strong);border-radius:9px;overflow:hidden;flex:0 0 auto}
.lg button{border:0;background:transparent;padding:7px 12px;font:600 13px var(--font);color:var(--muted);cursor:pointer}
.lg button.on{background:var(--navy);color:var(--on-navy)}
main.wrap{padding-block:20px 140px}
.demo{font-size:12.5px;color:var(--muted);border:1px dashed var(--border-strong);border-radius:10px;padding:8px 12px;margin-bottom:18px}
.hero h2{font-size:26px;line-height:1.2;letter-spacing:-.4px;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0 26px;padding:0;list-style:none;counter-reset:r}
.rules li{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:13.5px;line-height:1.4;counter-increment:r}
.rules li::before{content:counter(r);display:flex;width:24px;height:24px;border-radius:50%;background:var(--accent-bg);color:var(--accent-text);align-items:center;justify-content:center;font-weight:700;font-size:13px;margin-bottom:6px}
.lab{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px}
.deps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dep{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:left;cursor:pointer;font:inherit;color:var(--text);display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s}
.dep:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.dep:focus-visible,.opt:focus-visible,.btn:focus-visible,.lg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dep .nm{font-size:16.5px;font-weight:700}.dep .mt{font-size:13px;color:var(--muted)}
.dep.sent{border-color:var(--navy)}.dep .ok{font-size:13px;font-weight:600;color:var(--navy)}
.bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--navy);border-radius:3px;transition:width .2s}
.credit{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:34px;color:var(--muted);font-size:13px;text-align:center}
.alto{font:800 18px/1 var(--serif);letter-spacing:.04em;color:var(--text)}.alto b{color:var(--brand-red);font-weight:800}
.alto small{display:block;font:400 8.5px/1 var(--font);letter-spacing:.55em;color:var(--muted);margin-top:4px;padding-left:.55em}
.lock{font-size:12.5px}
.partners{display:flex;align-items:center;gap:16px}.partners .sep{width:1px;height:32px;background:var(--border-strong)}
.mm{text-align:left;line-height:1.25}.mm b{display:block;color:var(--text);font-size:14.5px;font-weight:700}.mm span{font-size:12px;color:var(--muted)}
/* department */
.back{border:0;background:none;color:var(--accent-text);font:600 14.5px var(--font);padding:0;cursor:pointer}
.dh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px}
.chip{font-size:12.5px;font-weight:600;color:var(--accent-text);background:var(--accent-bg);padding:5px 10px;border-radius:999px}
.stepn{font-size:13px;color:var(--muted)}
.dots{display:flex;gap:6px;margin:6px 0 16px}.dots i{height:4px;flex:1;border-radius:2px;background:var(--border)}.dots i.on{background:var(--navy)}
.st h2{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}.st .sh{color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.card.miss{border-color:var(--red)}
.qn{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.qt{font-size:16.5px;font-weight:600;line-height:1.35;margin-bottom:10px;text-wrap:pretty}
.qh{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 14px;font:500 14.5px/1.3 var(--font);cursor:pointer;text-align:left;max-width:100%}
.opt.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.multi .opt.on::before{content:"✓ "}
.opt.idk{color:var(--muted);border-style:dashed}.opt.idk.on{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.opt.idk.solo{margin-top:8px}
.inp{width:100%;border:1px solid var(--border-strong);border-radius:10px;padding:11px 12px;font:15px var(--font);color:var(--text);background:var(--surface)}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
textarea.inp{min-height:76px;resize:vertical}
.num{display:flex;align-items:center;gap:8px;max-width:240px}.num .u{color:var(--muted);font-weight:600}
.num .inp{font-variant-numeric:tabular-nums}
.sums{display:grid;gap:8px;margin-top:12px}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;font-size:14.5px}
.why{margin-top:12px;font-size:13.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.45}
.why b{color:var(--text);display:block;margin-bottom:2px;font-size:13px}
.sub{margin-top:14px;padding:12px 0 0 14px;border-left:2px solid var(--accent-bg);border-top:0}
.sub .qt{font-size:15px}
.file{margin-top:12px;border:1.5px dashed var(--border-strong);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;background:var(--bg)}
.file input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.file .ic{width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--accent-text)}
.file .ft{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}.file .fs{font-size:12.5px;color:var(--muted)}
.file.ok{border-style:solid;border-color:var(--navy);background:var(--accent-bg)}
.file:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--red);font-size:13.5px;margin-top:8px}
.pt{position:relative}
.pt .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pt .ph b{font-size:16px}
.del{border:0;background:none;color:var(--muted);font:500 13.5px var(--font);cursor:pointer;padding:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.fl .opts{margin-top:2px}
.fl+.fl,.grid2+.fl,.fl+.grid2{margin-top:12px}
.grid2 .fl{margin-top:0!important}
.add{width:100%;border:1.5px dashed var(--border-strong);background:transparent;color:var(--accent-text);border-radius:14px;padding:14px;font:600 15px var(--font);cursor:pointer}
.note{font-size:13.5px;color:var(--muted);margin:-6px 0 14px}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.foot .pr{flex:1;min-width:0;font-size:13px;color:var(--muted)}.foot .pr .bar{margin-top:6px}
.btn{border:0;background:var(--navy);color:var(--on-navy);font:700 15px var(--font);padding:13px 20px;border-radius:12px;cursor:pointer;flex:0 0 auto}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong);padding:12px 16px}
.thanks{text-align:center;padding:40px 4px}
.thanks .okc{width:64px;height:64px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.thanks h2{font-size:22px;margin:0 0 8px;text-wrap:balance}.thanks p{color:var(--muted);margin:0 auto 22px;max-width:44ch}
@media(max-width:640px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h2{font-size:22px}.deps{grid-template-columns:minmax(0,1fr)}.sumrow{grid-template-columns:minmax(0,1fr) 120px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.rw .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.rw .ph b{font-size:16px}
.card.rw.has{border-color:color-mix(in srgb,var(--navy) 45%,var(--border))}
.opts.solo{margin-top:8px}
.blk{margin-bottom:12px}.blk.miss>.err{margin:0 0 8px}
.tbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.why{margin:0 0 14px}.card .why{margin-top:12px}
.dep .mt{line-height:1.4}
.crows{display:grid}.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.crow>span{font-size:14.5px;min-width:0}.crow.chd{border:0;padding:0 0 4px}.crow.chd span{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1 id="ttl"></h1><div class="lg" hidden><button id="l-ru" data-l="ru" class="on">RU</button><button id="l-kz" data-l="kz">KZ</button></div></div></header>
<main class="wrap" id="app"></main>
<div class="foot" id="foot" hidden><div class="wrap" id="footIn"></div></div>
<script>
const o=(ru,kz)=>[ru,kz||ru];
const r=(...xs)=>xs.map(x=>o(x));
const kq=s=>({t:o(s),k:'txt'});
const WHY=o('Нам важны все расходы, включая оплаченные наличными или с личных карт. Без них себестоимость и прибыль будут посчитаны неверно. Информация конфиденциальна и третьим лицам не передаётся.');
const FREQ=r('Регулярно','Иногда','Нет');

const D=[
{id:'own',n:o('Собственник'),steps:[
 {n:o('Структура компании'),h:o('Добавьте каждое ТОО и ИП, через которые работает бизнес.'),q:[
  {t:o('Юрлица компании'),k:'rows',item:o('Юрлицо'),seed:[{}],fields:[
   {f:'name',t:o('Название'),k:'txt',ph:o('ТОО «…» или ИП …')},
   {f:'bin',t:o('БИН / ИИН'),k:'txt'},
   {f:'reg',t:o('Налоговый режим'),k:'one',a:r('Общеустановленный (ОУР)','Упрощённая декларация (СНР)')},
   {f:'vat',t:o('НДС'),k:'one',a:r('Плательщик НДС','Не плательщик НДС')},
   {f:'what',t:o('Что работает на этом юрлице'),k:'multi',a:r('Цех','Точки','Доставка','Закуп')}]}]},
 {n:o('Ответственные'),h:o('Кто отвечает за каждый участок. Если никто — оставьте пустым.'),q:[
  {t:o('Кто за что отвечает'),k:'grid',rows:r('Закуп','Приёмка товара','Инвентаризация','Касса и инкассация','Расчёт зарплаты','Оплата поставщикам','Цены в меню'),fields:[
   {f:'who',t:o('ФИО и должность'),k:'txt'}]},
  {t:o('Кто согласовывает оплаты?'),k:'one',a:r('Только собственник','Управляющий в пределах лимита','Бухгалтер','Без согласования'),
   s:[{on:[1],q:{t:o('Лимит без согласования собственника'),k:'num',u:'₸'}}]}]},
 {n:o('Деньги собственника'),why:1,q:[
  {t:o('Как вы получаете доход из бизнеса?'),k:'multi',a:r('Фиксированная зарплата','Дивиденды','Беру по мере необходимости','Пока не беру')},
  {t:o('Бывает, что личные расходы оплачиваются деньгами бизнеса или расходы бизнеса — с ваших личных карт?'),k:'one',a:FREQ,
   s:[{on:[0,1],q:{t:o('Через что чаще всего?'),k:'multi',a:r('Личная карта / Kaspi Gold','Наличные','Карта бизнеса')}}]}]},
 {n:o('Цели и показатели'),q:[
  {t:o('Какой, по-вашему, фудкост сейчас?'),h:o('Доля стоимости продуктов в цене блюда'),k:'num',u:'%'},
  {t:o('Как формируется цена в меню?'),k:'one',a:r('От себестоимости','По ценам конкурентов','Сложилась исторически')},
  {t:o('Какие месяцы сильные, какие слабые?'),k:'txt',short:1,ph:o('Например: лето сильное, январь слабый')},
  {t:o('Какие показатели вы хотите видеть каждую неделю?'),k:'multi',max:3,a:r('Выручка по точкам','Прибыль по точкам','Фудкост, %','Остаток денег','Долг поставщикам','Продажи доставки','Расходы на персонал')},
  {t:o('Планы на ближайший год'),k:'multi',a:r('Новые точки','Новый город','Франшиза','Расширение цеха','Без расширения')},
  kq('Что сейчас больше всего мешает управлять деньгами компании?')]}]},

{id:'acc',n:o('Бухгалтерия и финансы'),steps:[
 {n:o('Учёт'),q:[
  {t:o('В каких системах ведётся учёт?'),k:'multi',a:r('iiko','1С','Excel / Google Таблицы','Бумажный журнал'),
   s:[{on:[1],q:{t:o('Как данные iiko попадают в 1С?'),k:'one',a:r('Автоматическая выгрузка','Вручную','Не попадают')}}]},
  {t:o('Кто ведёт бухгалтерию?'),k:'one',a:r('Штатный бухгалтер','Аутсорсинг','Собственник')},
  {t:o('С какого месяца есть данные в iiko?'),k:'txt',short:1,ph:o('Например: январь 2025')},
  {t:o('Подключён iikoCloud (доступ по API)?'),k:'one',a:r('Да','Нет')},
  {t:o('Можно ли дать нам доступ к iiko только на чтение?'),k:'one',a:r('Да','Нужно согласовать','Нет')},
  {t:o('Какие отчёты собственник получает регулярно?'),k:'multi',a:r('Выручка за день','Прибыль за месяц','Остатки денег','Регулярных отчётов нет')}]},
 {n:o('Где хранятся деньги'),h:o('Перечислите все счета, Kaspi, кассы и карты, через которые проходят деньги бизнеса, в том числе личные.'),why:1,q:[

  {t:o('Подробно по каждому'),k:'rows',item:o('Счёт или касса'),seed:[{}],fields:[

   {f:'use',t:o('Для чего используется'),k:'multi',a:r('Приём выручки','Оплата поставщикам','Зарплата','Прочие расходы')},
   {f:'st',t:o('Выписка с января 2026'),k:'file',show:{f:'type',on:[0,1,4]}}]}]},
 {n:o('На что уходят деньги'),h:o('По каждой статье: сумма в месяц, чем платите и есть ли документы. Если расхода нет — пропустите строку.'),why:1,q:[
  {t:o('Расходы за месяц'),k:'grid',rows:r('Сырьё и продукты','Упаковка и одноразовая посуда','Аренда','Зарплата','Налоги и взносы','Коммунальные услуги','Курьеры и доставка','Комиссии Wolt, Яндекс и других сервисов','Банковские комиссии и эквайринг','Реклама и SMM','Ремонт и обслуживание оборудования','Кредиты и лизинг','Хозтовары и мелкие расходы','Прочее'),fields:[
   {f:'sum',t:o('Сумма в месяц'),k:'num',u:'₸'},
   {f:'pay',t:o('Чем платите'),k:'multi',a:r('Со счёта','Наличными из кассы','С личной карты')},
   {f:'doc',t:o('Документы'),k:'one',a:r('Есть всегда','Не всегда','Нет')}]}]},
 {n:o('Персонал'),q:[
  {t:o('Персонал по подразделениям'),k:'grid',rows:r('Цех','Точки','Курьеры','Управление и офис'),fields:[
   {f:'cnt',t:o('Человек'),k:'num'},
   {f:'fund',t:o('Фонд оплаты в месяц'),k:'num',u:'₸'},
   {f:'sys',t:o('Система оплаты'),k:'multi',a:r('Оклад','За смену','Процент','Премии')},
   {f:'how',t:o('Как выплачивается'),k:'one',a:r('На карту','Часть на карту, часть наличными','Наличными')}]},
  {t:o('Питание персонала'),k:'one',a:r('Бесплатно','Со скидкой','Не предусмотрено'),

 if(q.k==='rows')return(st.rows[key]||[]).some((r,i)=>q.fields.some(f=>f.k!=='file'&&filled(r[f.f])&&!(q.seed&&q.seed[i]&&q.seed[i][f.f]===r[f.f])));
 if(q.k==='grid')return Object.values(st.rows[key]||{}).some(r=>rowFilled(r,q.fields));

 return filled(st.a[key])}

 if(q.k==='one'||q.k==='multi')h+=`<div class="opts${q.k==='multi'?' multi':''}">${optBtns(q.a,q.k==='multi',v,`data-key="${key}"`)}${idkBtn(key,v)}</div>`;
 else if(q.k==='num')h+=`<div class="num"><input class="inp" id="i-${key}" inputmode="decimal" placeholder="0" data-key="${key}" value="${v&&v!=='idk'?esc(v):''}">${q.u?`<span class="u">${q.u}</span>`:''}</div><div class="opts solo">${idkBtn(key,v)}</div>`;
 else if(q.k==='txt'){const val=v&&v!=='idk'?esc(v):'',ph=q.ph?t(q.ph):t(U.ph);
  h+=(q.short?`<input class="inp" id="i-${key}" data-key="${key}" placeholder="${ph}" value="${val}">`:`<textarea class="inp" id="i-${key}" data-key="${key}" placeholder="${ph}">${val}</textarea>`)+`<div class="opts solo">${idkBtn(key,v)}</div>`}
 if(q.f||q.k==='file')h+=fileBox(key,q.f,st)+(q.k==='file'?`<div class="opts solo">${idkBtn(key,v,U.nofile)}</div>`:'');
 (q.s||[]).forEach((s,k)=>{if(v!==undefined&&v!=='idk'&&show(v,s.on)){const sk=key+'-s'+k;h+=`<div class="sub"><div class="qt">${t(s.q.t)}</div>${qBody(s.q,sk,st)}</div>`}});
 return h}
function fieldsHTML(q,key,ri,row,st){let h='',half=[];
 const flush=()=>{if(half.length){h+=`<div class="grid2">${half.join('')}</div>`;half=[]}};
 q.fields.forEach(f=>{if(f.show&&!show(row[f.show.f],f.show.on))return;
  const v=row[f.f],at=`data-r="${key}" data-ri="${ri}" data-f="${f.f}"`,id=`r-${key}-${ri}-${f.f}`.replace(/[^\w-]/g,'_');let c='';
  if(f.k==='txt')c=`<input class="inp rf" id="${id}" ${at} placeholder="${f.ph?t(f.ph):''}" value="${esc(v)}">`;
  else if(f.k==='num')c=`<div class="num"><input class="inp rf" id="${id}" inputmode="decimal" ${at} placeholder="0" value="${esc(v)}">${f.u?`<span class="u">${f.u}</span>`:''}</div>`;
  else if(f.k==='one'||f.k==='multi')c=`<div class="opts${f.k==='multi'?' multi':''}">${optBtns(f.a,f.k==='multi',v,at)}</div>`;
  else if(f.k==='file')c=fileBox(`${key}|${ri}|${f.f}`,null,st);
  const el=`<div class="fl"><span>${t(f.t)}</span>${c}</div>`;
  if(f.half)half.push(el);else{flush();h+=el}});
 flush();return h}
function rowsHTML(q,key,st){REG[key]=q;let h='';
 if(q.k==='rows'){const rows=st.rows[key];
  rows.forEach((row,ri)=>{h+=`<div class="card rw"><div class="ph"><b>${t(q.item)} ${ri+1}</b>${rows.length>1?`<button type="button" class="del" data-rdel="${key}" data-ri="${ri}">${t(U.del)}</button>`:''}</div>${fieldsHTML(q,key,ri,row,st)}</div>`});
  h+=`<button type="button" class="add" data-radd="${key}">${t(U.add,{a:t(q.item).toLowerCase()})}</button>`}
 else if(q.fields.length===1&&(q.fields[0].k==='txt'||q.fields[0].k==='num')){const rows=st.rows[key],f=q.fields[0];
  h+=`<div class="card"><div class="qt">${t(q.t)}</div><div class="crows"><div class="crow chd"><span></span><span>${t(f.t)}${f.u?', '+f.u:''}</span></div>`+q.rows.map((name,ri)=>{const v=(rows[ri]||{})[f.f],id=`r-${key}-${ri}-${f.f}`.replace(/[^\w-]/g,'_');
   return `<label class="crow"><span>${t(name)}</span><input class="inp rf" id="${id}" data-r="${key}" data-ri="${ri}" data-f="${f.f}"${f.k==='num'?' inputmode="decimal" placeholder="0"':''} value="${esc(v)}"></label>`}).join('')+`</div></div>`}
 else{const rows=st.rows[key];
  q.rows.forEach((name,ri)=>{const row=rows[ri]||{};h+=`<div class="card rw${rowFilled(row,q.fields)?' has':''}"><div class="ph"><b>${t(name)}</b></div>${fieldsHTML(q,key,ri,row,st)}</div>`})}
 return h}

function dept(id,keepScroll){const d=D.find(x=>x.id===id),st=S[id];view={v:'dep',id};
 const si=st.step,sp=d.steps[si],y=window.scrollY;
 let h=`<button type="button" class="back" id="back">${t(U.back)}</button><div class="dh"><span class="chip">${t(d.n)}</span><span class="stepn">${t(U.step,{a:si+1,b:d.steps.length})}</span></div><div class="dots">${d.steps.map((s,i)=>`<i class="${i<=si?'on':''}"></i>`).join('')}</div>
 <div class="st"><h2>${t(sp.n)}</h2>${sp.h?`<p class="sh">${t(sp.h)}</p>`:''}</div>`;
 if(sp.why)h+=`<div class="why"><b>${t(U.why)}</b>${t(WHY)}</div>`;
 if(si===0)h+=`<div class="card" id="c-who"><div class="qt">${t(U.who)}</div><input class="inp" id="who" placeholder="${t(U.whoPh)}" value="${esc(st.who)}"><div class="err" hidden>${t(U.fillWho)}</div></div>`;
 const base=d.steps.slice(0,si).reduce((n,s)=>n+s.q.length,0),total=mains(d).length;
 sp.q.forEach((q,qi)=>{const key=si+'-'+qi;
  if(q.k==='rows'||q.k==='grid'){h+=`<div id="c-${key}" class="blk">${rowsHTML(q,key,st)}<div class="err" hidden>${t(U.fillRows)}</div></div>`;return}
  h+=`<div class="card" id="c-${key}"><div class="qn">${base+qi+1} / ${total}</div><div class="qt">${t(q.t)}</div>${qBody(q,key,st)}<div class="err" hidden>${t(U.fill)}</div></div>`});
 app.innerHTML=h;
 footIn.innerHTML=`${si>0?`<button type="button" class="btn ghost" id="prev">${t(U.prev)}</button>`:''}<div class="pr"><span id="prT"></span><div class="bar"><i id="prB"></i></div></div><button type="button" class="btn" id="next">${si<d.steps.length-1?t(U.next):t(U.send)}</button>`;
 foot.hidden=false;prog();
 window.scrollTo(0,keepScroll?y:0);
 if(st._tried===si)validate(false)}
function prog(){const d=D.find(x=>x.id===view.id),n=doneN(d),m=mains(d).length;document.getElementById('prT').textContent=t(U.ans,{a:n,b:m});document.getElementById('prB').style.width=n/m*100+'%'}
function validate(scroll){const d=D.find(x=>x.id===view.id),st=S[d.id],si=st.step;let first=null;
 const mark=(c,bad)=>{c.classList.toggle('miss',bad);const e=c.querySelector(':scope>.err');if(e)e.hidden=!bad;if(bad&&!first)first=c};
 if(si===0)mark(document.getElementById('c-who'),!st.who.trim());
 d.steps[si].q.forEach((q,qi)=>{const key=si+'-'+qi;mark(document.getElementById('c-'+key),!isAns(st,key,q))});
 if(first&&scroll)first.scrollIntoView({behavior:'smooth',block:'center'});return!first}
function thanks(id){view={v:'thx',id};foot.hidden=true;
 app.innerHTML=`<div class="thanks"><div class="okc">✓</div><h2>${t(U.thx)}</h2><p>${t(U.thxP)}</p><div class="tbtn"><button type="button" class="btn" id="home">${t(U.home)}</button><button type="button" class="btn ghost" id="edit">${t(U.edit)}</button></div></div>`;window.scrollTo(0,0)}
function render(){document.getElementById('ttl').innerHTML=t(U.ttl);document.documentElement.lang=L==='ru'?'ru':'kk';
 document.querySelectorAll('.lg button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 if(view.v==='dep')dept(view.id,true);else if(view.v==='thx')thanks(view.id);else home()}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.l){L=b.dataset.l;try{localStorage.setItem(KEY+'-l',L)}catch(_){}render();return}
 if(b.dataset.dep){S[b.dataset.dep].sent?thanks(b.dataset.dep):dept(b.dataset.dep);return}
 if(b.id==='back'||b.id==='home'){home();return}
 const st=view.id&&S[view.id];if(!st)return;
 if(b.id==='edit'){st.step=0;dept(view.id);return}
 if(b.id==='prev'){st.step--;save();dept(view.id);return}
 if(b.id==='next'){st._tried=st.step;if(!validate(true))return;const d=D.find(x=>x.id===view.id);
  if(st.step<d.steps.length-1){st.step++;save();dept(view.id)}else{st.sent=true;save();thanks(view.id)}return}
 if(b.dataset.radd){st.rows[b.dataset.radd].push({});save();dept(view.id,true);return}
 if(b.dataset.rdel){st.rows[b.dataset.rdel].splice(+b.dataset.ri,1);save();dept(view.id,true);return}
 if(b.dataset.r){const q=REG[b.dataset.r],f=q.fields.find(x=>x.f===b.dataset.f),ri=+b.dataset.ri,j=+b.dataset.j;
  const rows=st.rows[b.dataset.r],row=rows[ri]||(rows[ri]={});let v=row[f.f];
  if(f.k==='multi'){v=Array.isArray(v)?v:[];v=v.includes(j)?v.filter(x=>x!==j):[...v,j]}else v=(v===j?undefined:j);
  row[f.f]=v;save();dept(view.id,true);return}
 if(b.dataset.key){const key=b.dataset.key,q=REG[key],j=b.dataset.j==='idk'?'idk':+b.dataset.j;let v=st.a[key];
  if(q.k==='multi'&&j!=='idk'){v=Array.isArray(v)?v:[];if(v.includes(j))v=v.filter(x=>x!==j);else{if(q.max&&v.length>=q.max)return;v=[...v,j]}}
  else v=(v===j?undefined:j);
  if(v===undefined)delete st.a[key];else st.a[key]=v;save();dept(view.id,true)}});
document.addEventListener('input',e=>{const el=e.target,st=view.id&&S[view.id];if(!st)return;
 if(el.id==='who')st.who=el.value;
 else if(el.classList.contains('rf')){const rows=st.rows[el.dataset.r],ri=+el.dataset.ri;(rows[ri]||(rows[ri]={}))[el.dataset.f]=el.value}
 else if(el.dataset.key){st.a[el.dataset.key]=el.value;const c=el.closest('.card,.sub'),idk=c&&c.querySelector(`.idk[data-key="${el.dataset.key}"]`);if(idk)idk.classList.remove('on')}
 else return;save();prog()});
document.addEventListener('change',e=>{const el=e.target;if(el.type!=='file'||!el.dataset.file)return;const st=S[view.id];
 st.files[el.dataset.file]=[...el.files].map(f=>f.name);if(st.a[el.dataset.file]==='idk')delete st.a[el.dataset.file];save();dept(view.id,true)});
render();
</script>
</body>
</html>
